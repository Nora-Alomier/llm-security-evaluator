[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-security-evaluator"
version = "0.1.0"
description = "A local, configuration-driven security evaluation framework for LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "LLM Security Evaluator contributors" }]
keywords = ["llm", "security", "ollama", "prompt-injection", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0.2,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
llmsec = "llm_security_evaluator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_security_evaluator"]

[tool.hatch.build.targets.wheel.force-include]
"examples/banking-assistant.yaml" = "llm_security_evaluator/data/banking-assistant.yaml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a running local Ollama server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/llm_security_evaluator/reporters/html_reporter.py" = ["E501"]

